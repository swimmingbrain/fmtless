[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fmtless"
version = "0.1.0"
description = "Decode fmtless log frames using the firmware's ELF"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Braian Plaku" }]
keywords = ["embedded", "logging", "firmware", "elf", "cortex-m"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Logging",
]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
fmtless = "fmtless.cli:main"

[project.urls]
Homepage = "https://github.com/swimmingbrain/fmtless"

[tool.setuptools.packages.find]
include = ["fmtless*"]
